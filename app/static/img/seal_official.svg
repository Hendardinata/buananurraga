<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="stampRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="50%" stop-color="#B91C1C" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
  </defs>

  <!-- Official Stamp (Stempel Basah Sah Perguruan Silat Buana Nurraga) -->
  <g transform="translate(150, 150)">
    <!-- Outer Security Dotted Ring -->
    <circle cx="0" cy="0" r="142" fill="none" stroke="url(#stampRedGrad)" stroke-width="3" stroke-dasharray="6, 3" opacity="0.8" />
    <!-- Outer Solid Ring -->
    <circle cx="0" cy="0" r="134" fill="none" stroke="url(#stampRedGrad)" stroke-width="4" />
    <!-- Fine Inner Guard Ring -->
    <circle cx="0" cy="0" r="126" fill="none" stroke="url(#stampRedGrad)" stroke-width="1.5" stroke-dasharray="3, 3" />
    <!-- Mid Ring -->
    <circle cx="0" cy="0" r="94" fill="none" stroke="url(#stampRedGrad)" stroke-width="3" />

    <!-- Circular Text Top: DEWAN PENDEKAR PUSAT -->
    <path id="sealTextUpper" d="M -107,0 A 107,107 0 1,1 107,0" fill="none" />
    <text font-family="'Cinzel', 'Georgia', 'Arial Black', serif" font-size="12.5" font-weight="900" fill="#B91C1C" letter-spacing="2.8">
      <textPath href="#sealTextUpper" startOffset="50%" text-anchor="middle">
        ★ DEWAN PENDEKAR PUSAT ★
      </textPath>
    </text>

    <!-- Circular Text Bottom: PENGURUS BESAR BUANA NURRAGA -->
    <path id="sealTextLower" d="M 107,0 A 107,107 0 0,1 -107,0" fill="none" />
    <text font-family="'Cinzel', 'Georgia', 'Arial Black', serif" font-size="11" font-weight="900" fill="#B91C1C" letter-spacing="2">
      <textPath href="#sealTextLower" startOffset="50%" text-anchor="middle">
        PENGURUS BESAR BUANA NURRAGA
      </textPath>
    </text>

    <!-- Center Seal Core -->
    <circle cx="0" cy="0" r="76" fill="none" stroke="url(#stampRedGrad)" stroke-width="1.8" />
    <!-- Octagram / Star Motif -->
    <polygon points="0,-48 12,-16 48,0 12,16 0,48 -12,16 -48,0 -12,-16" fill="none" stroke="url(#stampRedGrad)" stroke-width="1.5" opacity="0.6"/>
    
    <text x="0" y="-14" font-family="'Cinzel', serif" font-size="10" font-weight="800" fill="#B91C1C" text-anchor="middle" letter-spacing="3.5">CAP RESMI</text>
    <text x="0" y="8" font-family="'Cinzel', 'Impact', serif" font-size="20" font-weight="900" fill="#B91C1C" text-anchor="middle" letter-spacing="1.5">BN</text>
    <text x="0" y="25" font-family="'Cinzel', serif" font-size="9" font-weight="800" fill="#B91C1C" text-anchor="middle" letter-spacing="2.5">TERDAFTAR</text>
    <line x1="-38" y1="30" x2="38" y2="30" stroke="url(#stampRedGrad)" stroke-width="1.2" />
    <text x="0" y="44" font-family="'Courier New', monospace" font-size="8.5" font-weight="bold" fill="#B91C1C" text-anchor="middle" letter-spacing="1.5">NTB - INDONESIA</text>
  </g>
</svg>
