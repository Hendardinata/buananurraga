<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="gGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#AA771C" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="gGreen" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E7D32" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#004D40" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Concentric Rosettes / Mathematical Guilloche Curves -->
  <g fill="none" stroke="url(#gGold)" stroke-width="0.8">
    <!-- Center Wave Rosette -->
    <path d="M 300,50 Q 420,120 450,200 T 300,350 T 150,200 T 300,50" />
    <path d="M 300,60 Q 410,130 440,200 T 300,340 T 160,200 T 300,60" />
    <path d="M 300,70 Q 400,140 430,200 T 300,330 T 170,200 T 300,70" />
    <path d="M 300,80 Q 390,150 420,200 T 300,320 T 180,200 T 300,80" />
    <path d="M 300,90 Q 380,160 410,200 T 300,310 T 190,200 T 300,90" />
    <path d="M 300,100 Q 370,170 400,200 T 300,300 T 200,200 T 300,100" />

    <!-- Angled Cross Weaves -->
    <path d="M 200,80 Q 350,150 400,320 T 200,280 T 120,150 T 200,80" stroke="url(#gGreen)" stroke-width="0.7"/>
    <path d="M 400,80 Q 250,150 200,320 T 400,280 T 480,150 T 400,80" stroke="url(#gGreen)" stroke-width="0.7"/>
    
    <!-- Flowing Sine Waves Across Card -->
    <path d="M 0,100 C 150,40 300,160 450,100 C 520,70 570,130 600,100" />
    <path d="M 0,130 C 150,70 300,190 450,130 C 520,100 570,160 600,130" />
    <path d="M 0,160 C 150,100 300,220 450,160 C 520,130 570,190 600,160" />
    <path d="M 0,240 C 150,300 300,180 450,240 C 520,270 570,210 600,240" />
    <path d="M 0,270 C 150,330 300,210 450,270 C 520,300 570,240 600,270" />
    <path d="M 0,300 C 150,360 300,240 450,300 C 520,330 570,270 600,300" />
  </g>
</svg>
